server:
  port: 8090
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
spring:
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/foodflow;MODE=MySQL;DATABASE_TO_LOWER=TRUE}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
foodflow:
  demo-password: ${DEMO_PASSWORD:FoodFlow-demo-2026!}
  demo-operations: ${DEMO_OPERATIONS:true}
  sandbox-payments: ${SANDBOX_PAYMENTS:true}
  payment-webhook-secret: ${PAYMENT_WEBHOOK_SECRET:local-sandbox-payment-secret-change-me}
  service-zone: ${SERVICE_ZONE:Asia/Kolkata}
  restaurant:
    timeout-scan-ms: ${RESTAURANT_TIMEOUT_SCAN_MS:15000}
  delivery:
    offer-scan-ms: ${DELIVERY_OFFER_SCAN_MS:5000}
---
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/foodflow}
    username: ${DB_USER:foodflow}
    password: ${DB_PASSWORD}
