server:
  port: 8090
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
spring:
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/foodflow;MODE=MySQL;DATABASE_TO_LOWER=TRUE}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
foodflow:
  demo-password: ${DEMO_PASSWORD:FoodFlow-demo-2026!}
  demo-operations: ${DEMO_OPERATIONS:true}
---
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/foodflow}
    username: ${DB_USER:foodflow}
    password: ${DB_PASSWORD}
