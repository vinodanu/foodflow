name: FoodFlow staging deployment

on:
  workflow_dispatch:
    inputs:
      confirm_deployment:
        description: Confirm AWS staging resources may be created or updated (AWS charges apply).
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: mvn -B -f backend/pom.xml test
      - run: mvn -B -f backend/pom.xml package -DskipTests
      - run: npm run build
      - run: npm test

  deploy-staging:
    needs: validate
    if: ${{ inputs.confirm_deployment == true && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      CERTIFICATE_ARN: ${{ vars.STAGING_CERTIFICATE_ARN }}
      STAGING_DOMAIN: ${{ vars.STAGING_DOMAIN_NAME }}
      HOSTED_ZONE_ID: ${{ vars.HOSTED_ZONE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Validate deployment settings
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AWS_REGION" || { echo 'Set repository variable AWS_REGION.'; exit 1; }
          test -n "$CERTIFICATE_ARN" || { echo 'Set repository variable STAGING_CERTIFICATE_ARN.'; exit 1; }
          test -n "$STAGING_DOMAIN" || { echo 'Set repository variable STAGING_DOMAIN_NAME.'; exit 1; }
          test -n "$HOSTED_ZONE_ID" || { echo 'Set repository variable HOSTED_ZONE_ID.'; exit 1; }
      - name: Bootstrap staging infrastructure when needed
        shell: bash
        run: |
          set -euo pipefail
          if ! aws cloudformation describe-stacks --stack-name foodflow-staging >/dev/null 2>&1; then
            aws cloudformation deploy \
              --template-file infra/staging.yaml \
              --stack-name foodflow-staging \
              --capabilities CAPABILITY_IAM \
              --parameter-overrides \
                CertificateArn="$CERTIFICATE_ARN" \
                StagingDomainName="$STAGING_DOMAIN" \
                HostedZoneId="$HOSTED_ZONE_ID" \
                ImageTag=bootstrap \
                DesiredCount=0
          fi
      - name: Read ECR repository locations
        id: ecr
        shell: bash
        run: |
          set -euo pipefail
          outputs="$(aws cloudformation describe-stacks --stack-name foodflow-staging --query 'Stacks[0].Outputs' --output json)"
          echo "web_uri=$(jq -r '.[] | select(.OutputKey == "WebRepositoryUri") | .OutputValue' <<< "$outputs")" >> "$GITHUB_OUTPUT"
          echo "api_uri=$(jq -r '.[] | select(.OutputKey == "ApiRepositoryUri") | .OutputValue' <<< "$outputs")" >> "$GITHUB_OUTPUT"
      - name: Sign in to Amazon ECR
        shell: bash
        run: |
          set -euo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          registry="${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$registry"
      - name: Build and publish immutable images
        shell: bash
        env:
          WEB_URI: ${{ steps.ecr.outputs.web_uri }}
          API_URI: ${{ steps.ecr.outputs.api_uri }}
        run: |
          set -euo pipefail
          image_tag="${GITHUB_SHA}-${GITHUB_RUN_ATTEMPT}"
          docker build --pull --tag "$WEB_URI:$image_tag" .
          docker build --pull --tag "$API_URI:$image_tag" ./backend
          docker push "$WEB_URI:$image_tag"
          docker push "$API_URI:$image_tag"
          echo "IMAGE_TAG=$image_tag" >> "$GITHUB_ENV"
      - name: Deploy staging service
        shell: bash
        run: |
          set -euo pipefail
          aws cloudformation deploy \
            --template-file infra/staging.yaml \
            --stack-name foodflow-staging \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides \
              CertificateArn="$CERTIFICATE_ARN" \
              StagingDomainName="$STAGING_DOMAIN" \
              HostedZoneId="$HOSTED_ZONE_ID" \
              ImageTag="$IMAGE_TAG" \
              DesiredCount=1
      - name: Show staging URL
        shell: bash
        run: aws cloudformation describe-stacks --stack-name foodflow-staging --query 'Stacks[0].Outputs[?OutputKey==`StagingUrl`].OutputValue | [0]' --output text
